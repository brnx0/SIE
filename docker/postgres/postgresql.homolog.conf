# Tuning leve p/ homologacao (host ~1-2GB dedicado ao Postgres).
# Ajuste shared_buffers ~25% RAM, effective_cache_size ~50-75% RAM.

listen_addresses = '*'

# Memoria
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

# WAL / checkpoint
wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# Conexoes
max_connections = 50

# Logs - pega slow query antes de chegar em producao
log_min_duration_statement = 500   # ms
log_line_prefix = '%t [%p] %u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# Locale - libc C.UTF-8 (pt_BR.UTF-8 nao existe na imagem oficial).
# Ordenacao pt-BR vem do ICU definido no initdb (POSTGRES_INITDB_ARGS).
timezone = 'America/Sao_Paulo'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
