# EXEMPLO p/ o nginx do HOST (NAO roda em container).
# Copie p/ /etc/nginx/sites-available/ (ou conf.d) e ajuste server_name/root/ssl.
# App roda como php-fpm puro no container, exposto em 127.0.0.1:9000.

server {
    listen 80;
    # listen 443 ssl;  # + ssl_certificate / ssl_certificate_key
    server_name homolog.seudominio.gov.br;

    # root = pasta ./public do projeto NO HOST (bind-mount do compose).
    # Ex.: /srv/sie_matricula/public  (ou F:/Dev/SIE_MATRICULA/public no Windows)
    root /CAMINHO/DO/PROJETO/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # CRITICO: caminho DENTRO do container php-fpm (= bind-mount ./public).
        # NAO usar $realpath_root/$document_root do host.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Assets buildados (Vite) - servidos direto pelo nginx do host.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
