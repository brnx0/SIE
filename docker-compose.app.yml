# App (php-fpm) por MUNICIPIO. DB vive em docker-compose.db.yml — instancia UNICA
# compartilhada por todos os municipios (1 Postgres, N bancos).
# Parametrizado por ${MUNICIPIO} (default: homolog). Define no .env: MUNICIPIO=coruripe
#
# Cada municipio conecta no SEU banco: DB_DATABASE/DB_USERNAME/DB_PASSWORD vem do
# .env deste municipio (o banco/role e criado por docker/postgres/provision-municipio.sh).
#
# Pre-req: subir o DB unico e provisionar este municipio antes ->
#   docker compose -f docker-compose.db.yml up -d
#   ./docker/postgres/provision-municipio.sh $DB_DATABASE $DB_USERNAME '<senha>'
#
# Build+subir:  docker compose -f docker-compose.app.yml up -d --build
# Logs:         docker compose -f docker-compose.app.yml logs -f app
# Artisan:      docker compose -f docker-compose.app.yml exec app php artisan <cmd>
# Parar app:    docker compose -f docker-compose.app.yml down     (NAO toca no DB)
#
# SEM nginx no compose: nginx do HOST faz fastcgi_pass -> 127.0.0.1:${FPM_PORT}
# e serve estaticos de ./public (entrypoint do app sincroniza public/build).
#
# .env: APP_KEY setada, APP_ENV=production, APP_DEBUG=false. DB_HOST/DB_PORT
# sao SOBRESCRITOS p/ o container: padrao db:5432 (Postgres do docker-compose.db.yml
# na rede sie_net). Banco em OUTRA maquina: defina no .env do municipio
#   DB_HOST_DOCKER=<ip/host do servidor de banco>   (e DB_PORT_DOCKER, se nao for 5432)
# - o servidor de banco precisa aceitar conexao vinda desta maquina (listen_addresses,
# pg_hba.conf e firewall/security list liberando a porta para o IP do app).

services:
  app:
    build:
      context: .
      target: runtime
    image: sie_matricula_app:${MUNICIPIO:-homolog}
    container_name: sie_app_${MUNICIPIO:-homolog}
    restart: unless-stopped
    env_file: .env
    environment:
      # conexao pela rede docker - ignora DB_HOST/DB_PORT do .env
      DB_HOST: ${DB_HOST_DOCKER:-db}
      DB_PORT: ${DB_PORT_DOCKER:-5432}
      # migrations NAO rodam no boot (prod = controlado). Deploy:
      #   docker compose -f docker-compose.app.yml run --rm app php artisan migrate --force
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
    ports:
      # php-fpm SO no loopback - nginx do HOST faz fastcgi_pass aqui. Varie por cliente.
      - "127.0.0.1:${FPM_PORT:-9000}:9000"
    volumes:
      - app_storage:/var/www/html/storage/app
      # public no host -> nginx do HOST serve estaticos daqui (entrypoint sincroniza)
      - ./public:/var/www/html/public
    networks: [sie_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Worker de fila (queue:work). Processa os Jobs (ex.: importação do Censo).
  # Mesma imagem do app; o entrypoint pula o prep de php-fpm e só executa o comando.
  # IMPORTANTE: compartilha app_storage p/ enxergar o arquivo enviado no upload.
  # Após deploy de código novo: docker compose -f docker-compose.app.yml restart worker
  worker:
    image: sie_matricula_app:${MUNICIPIO:-homolog}
    container_name: sie_worker_${MUNICIPIO:-homolog}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-db}
      DB_PORT: ${DB_PORT_DOCKER:-5432}
    # --timeout=1900 > timeout do CommitCensoLoteJob (1800); --max-time recicla de hora em hora.
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=1900
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on: [app]
    networks: [sie_net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  sie_net:
    name: sie_net
    external: true        # rede compartilhada, criada pelo docker-compose.db.yml

volumes:
  app_storage:
    name: sie_app_storage_${MUNICIPIO:-homolog}
