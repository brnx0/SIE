# Postgres por MUNICIPIO - ciclo de vida proprio (sobe 1x, fica rodando).
# Parametrizado por ${MUNICIPIO} (default: homolog). Define no .env: MUNICIPIO=coruripe
#
# Subir:   docker compose -f docker-compose.db.yml up -d
# Backup:  docker exec sie_pg_${MUNICIPIO} pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" > backup.sql
# Parar:   docker compose -f docker-compose.db.yml down        (volume PERSISTE)
# NUNCA:   down -v   (apaga o banco!)
#
# Cria a rede sie_net_${MUNICIPIO} que o app (docker-compose.app.yml) usa como external.

services:
  db:
    image: postgres:16.4
    container_name: sie_pg_${MUNICIPIO:-homolog}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-sie_auth}
      POSTGRES_USER: ${DB_USERNAME:-sie_homolog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      # Imagem oficial NAO tem pt_BR.UTF-8 -> ICU p/ collation pt-BR + libc C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=pt-BR"
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo

    # Porta publicada SO em 127.0.0.1 do servidor: app conecta pela rede docker
    # (db:5432) e o acesso externo (DBeaver) e feito por SSH tunnel -> localhost:5432.
    # NAO trocar por "5432:5432" (0.0.0.0) num servidor publico: exporia o banco.
    # Acesso p/ debug via:  docker compose -f docker-compose.db.yml exec db psql -U <user> -d <db>
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.homolog.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

    networks: [sie_net]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          # ajuste conforme o host (servidor tem 1 CPU). Max = nº de CPUs.
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  sie_net:
    name: sie_net_${MUNICIPIO:-homolog}

volumes:
  pg_data:
    name: sie_pg_${MUNICIPIO:-homolog}_data
