# Postgres - ambiente de HOMOLOGAÇÃO
# Subir:   docker compose -f docker-compose.homolog.yml --env-file .env.homolog up -d
# Logs:    docker compose -f docker-compose.homolog.yml logs -f db
# Backup:  docker exec sie_pg_homolog pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" > backup.sql
# Parar:   docker compose -f docker-compose.homolog.yml down   (volume PERSISTE)

services:
  db:
    image: postgres:16.4
    container_name: sie_pg_homolog
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-sie_auth}
      POSTGRES_USER: ${DB_USERNAME:-sie_homolog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:}
      # Locale pt_BR p/ ordenacao/acentuacao igual producao
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=pt_BR.UTF-8"
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo

    # Bind SO no loopback do host. Nada exposto pra rede externa.
    # Se app roda em outro container, prefira rede docker e REMOVA o ports.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - pg_homolog_data:/var/lib/postgresql/data
      # Tuning leve aplicado no boot (ver conf abaixo)
      - ./docker/postgres/postgresql.homolog.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pg_homolog_data:
    name: sie_pg_homolog_data
